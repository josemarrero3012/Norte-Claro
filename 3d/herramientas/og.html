<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rumbo Norte — imagen para compartir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&amp;family=Manrope:wght@700;800&amp;display=swap">
<link rel="stylesheet" href="../../styles.css">
<style>
html,body { margin:0; width:1200px; height:630px; overflow:hidden; background:white; }
.og { position:relative; width:1200px; height:630px; display:grid; grid-template-columns:620px 1fr; align-items:center; padding-left:64px; background:radial-gradient(ellipse at 92% 30%,#DFEAFF,transparent 52%),#F8FAFF; }
.og::after { content:""; position:absolute; bottom:0; left:0; width:100%; height:8px; background:var(--brand-gradient); }
.og-brand { position:absolute; top:40px; left:64px; width:232px; padding:8px 12px; background:white; border-radius:8px; }
.og-copy { padding-top:70px; position:relative; z-index:1; }
.og h1 { font-size:68px; line-height:1.04; letter-spacing:-.055em; margin:0; }
.og h1 span { color:var(--accent); }
.og .k { margin-top:28px; font:700 20px/1.4 var(--sans); color:var(--ink); }
.og .d { margin-top:14px; font:400 21px/1.5 var(--sans); color:var(--ink-mute); }
.og-art { width:520px; max-width:none; height:520px; margin-left:-40px; margin-top:15px; }
.og-note { position:absolute; bottom:37px; left:64px; font:600 16px var(--sans); color:var(--accent-deep); }
</style>
</head>
<body>
<div class="og">
<img class="og-brand" src="../../assets/logo.svg" alt="Rumbo Norte" width="292" height="84">
<div class="og-copy">
<h1>Trabajar en Europa.<br>Con <span>Rumbo Norte.</span></h1>
<p class="k">Países Bajos · Bélgica · Alemania</p>
<p class="d">El neto real y las condiciones, antes de decidir.<br>En español. Sin coste para ti.</p>
</div>
<img class="og-art" src="../../assets/3d/brujula.webp?v=20261104" alt="">
<p class="og-note">Reclutamiento sin promesas</p>
</div>
</body>
</html>
